name: Go

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # mise instala Go desde mise.toml/mise.lock; la misma config que en local
      - uses: jdx/mise-action@v5
      # Los tests no dependen de data/, solo de CSV pequeños creados en memoria
      - name: Verificación (mise run check)
        run: mise run check
